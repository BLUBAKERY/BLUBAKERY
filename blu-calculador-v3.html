<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blu Bakery - Calculador Completo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; color: #004e64; }
        header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 30px; border-bottom: 2px solid #004e64; }
        .tab-btn { padding: 12px 24px; border: none; background: transparent; color: #666; cursor: pointer; font-weight: 600; border-bottom: 3px solid transparent; margin-bottom: -2px; }
        .tab-btn.active { color: #004e64; border-bottom-color: #d7a13a; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        label { display: block; font-weight: 600; color: #333; margin-bottom: 8px; margin-top: 20px; }
        input, textarea, select { width: 100%; padding: 12px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 1em; font-family: inherit; margin-bottom: 12px; }
        input:focus, textarea:focus { outline: none; border-color: #004e64; box-shadow: 0 0 0 3px rgba(0,78,100,0.1); }
        textarea { min-height: 150px; font-family: monospace; font-size: 0.9em; }
        button { padding: 12px 24px; background: #004e64; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; margin-right: 10px; margin-top: 10px; }
        button:hover { background: #003845; }
        .btn-secondary { background: #f2e6d8; color: #004e64; border: 1.5px solid #004e64; }
        .btn-secondary:hover { background: #e8d5c4; }
        .btn-small { padding: 8px 12px; font-size: 0.9em; margin: 0 5px 0 0; }
        .section { margin: 30px 0; padding: 20px; background: #f9f9f9; border-left: 4px solid #d7a13a; border-radius: 6px; }
        .section h3 { color: #004e64; margin-bottom: 15px; font-size: 1.2em; }
        .ing-row { display: grid; grid-template-columns: 2fr 100px 80px 100px 80px auto; gap: 10px; align-items: center; padding: 12px; background: white; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 10px; }
        .ing-row input, .ing-row select { margin: 0; }
        .ing-row button { margin: 0; padding: 6px 10px; font-size: 0.85em; }
        .cost-summary { background: linear-gradient(135deg, #f2e6d8 0%, #e8d5c4 100%); border-left: 5px solid #d7a13a; padding: 20px; border-radius: 8px; margin: 20px 0; }
        .cost-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #ddd; }
        .cost-row.total { font-weight: 700; font-size: 1.2em; border-bottom: none; padding-top: 15px; color: #004e64; }
        .cost-row.highlight { background: white; padding: 12px; margin: 10px 0; border-radius: 6px; font-weight: 600; }
        .message { padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .message.success { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .message.error { background: #f8d7da; color: #721c24; border-left: 4px solid #f5c6cb; }
        .message.info { background: #d1ecf1; color: #0c5460; border-left: 4px solid #bee5eb; }
        .message.warning { background: #fff3cd; color: #856404; border-left: 4px solid #ffc107; }
        .loading { text-align: center; padding: 40px; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #004e64; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .recipe-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-top: 20px; }
        .recipe-card { background: white; border: 2px solid #004e64; border-radius: 8px; padding: 15px; cursor: pointer; transition: all 0.3s; }
        .recipe-card:hover { box-shadow: 0 8px 16px rgba(0,78,100,0.2); }
        .recipe-card h4 { color: #004e64; margin-bottom: 8px; }
        .recipe-card p { color: #666; font-size: 0.85em; margin-bottom: 5px; }
        @media (max-width: 768px) { .ing-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍪 Blu Bakery</h1>
            <p>Calculador Inteligente de Costos</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('calculator')">📝 Calculador</button>
            <button class="tab-btn" onclick="switchTab('config')">⚙️ Configuración</button>
        </div>

        <!-- TAB CALCULADOR -->
        <div id="calculator" class="tab-content active">
            <div class="card">
                <h2>📝 Cargar Receta</h2>
                <div id="loadStatus"></div>

                <label>Nombre de la cookie:</label>
                <input type="text" id="cookieName" placeholder="Ej: COOKIE NUTELLA & ESPRESSO">

                <label>Pega la receta aquí (copia de tu Google Doc):</label>
                <textarea id="recipeText" placeholder="MASA:&#10;460g manteca pomada&#10;200g azúcar blanca&#10;...&#10;&#10;RELLENO:&#10;615g nutella&#10;...&#10;&#10;TOPPING (opcional):&#10;..."></textarea>

                <button onclick="parseAndLoadRecipe()">🔄 CARGAR RECETA</button>
                <button class="btn-secondary" onclick="clearForm()">Limpiar</button>

                <div id="recipesList" class="recipe-list"></div>
            </div>

            <div id="recipeEditor" style="display: none;">
                <div class="card">
                    <h2>📊 Editar: <span id="editRecipeName"></span></h2>

                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 30px;">
                        <div>
                            <label>Cantidad de cookies:</label>
                            <input type="number" id="cookieQty" value="22" min="1" onchange="recalculateCosts()">
                        </div>
                        <div>
                            <label>Peso por cookie (g):</label>
                            <input type="number" id="cookieWeight" value="130" min="1" onchange="recalculateCosts()">
                        </div>
                        <div>
                            <label>Costo packaging:</label>
                            <input type="number" id="packagingCost" value="0" min="0" onchange="recalculateCosts()">
                        </div>
                    </div>

                    <!-- MASA -->
                    <div class="section">
                        <h3>🥣 MASA</h3>
                        <div id="masaContainer"></div>
                    </div>

                    <!-- RELLENO -->
                    <div class="section">
                        <h3>🍫 RELLENO</h3>
                        <div id="rellenoContainer"></div>
                    </div>

                    <!-- TOPPING -->
                    <div class="section">
                        <h3>✨ TOPPING</h3>
                        <div id="toppingContainer"></div>
                    </div>

                    <!-- RESUMEN -->
                    <div id="costSummary"></div>

                    <button onclick="backToList()">← Volver</button>
                </div>
            </div>
        </div>

        <!-- TAB CONFIGURACIÓN -->
        <div id="config" class="tab-content">
            <div class="card">
                <h2>⚙️ Configuración - Costos Indirectos</h2>

                <label>Mermas (%):</label>
                <input type="number" id="mermas" value="8" min="0" max="100" onchange="updateIndirectsDisplay()">

                <label>Traslados (%):</label>
                <input type="number" id="transports" value="5" min="0" max="100" onchange="updateIndirectsDisplay()">

                <label>Marketing (%):</label>
                <input type="number" id="marketing" value="4" min="0" max="100" onchange="updateIndirectsDisplay()">

                <div class="cost-summary">
                    <strong>Total Indirectos: <span id="totalIndirect">17%</span></strong>
                </div>

                <button onclick="saveConfig()">💾 Guardar Configuración</button>

                <div style="margin-top: 40px; padding-top: 30px; border-top: 2px solid #ddd;">
                    <h3>📊 Estado de Conexión</h3>
                    <div id="connectionStatus"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================================
        // CONFIGURACIÓN
        // ============================================================================
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx0-DaHbBBVPeMJK3RhG0sLWj-LWLj9scR3YmABlLEscEFpOCY3UlcHAr31lawrXEyAlg/exec";
        
        let allData = {
            ingredients: [],
            recipes: [],
            packaging: []
        };

        let currentRecipe = null;
        let recipeData = {
            masa: [],
            relleno: [],
            topping: []
        };

        let config = JSON.parse(localStorage.getItem('bluConfig')) || {
            mermas: 8,
            transports: 5,
            marketing: 4
        };

        // ============================================================================
        // FUNCIONES PRINCIPALES
        // ============================================================================
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function showMessage(elementId, text, type = 'info') {
            const div = document.getElementById(elementId);
            if (div) div.innerHTML = `<div class="message ${type}">${text}</div>`;
        }

        // ============================================================================
        // CARGAR DATOS DEL APPS SCRIPT
        // ============================================================================
        async function loadData() {
            try {
                showMessage('loadStatus', '⏳ Cargando datos desde Google Sheets y Docs...', 'info');
                
                const response = await fetch(APPS_SCRIPT_URL);
                const data = await response.json();

                allData = {
                    ingredients: data.ingredients || [],
                    recipes: data.recipes || [],
                    packaging: data.packaging || []
                };

                showMessage('loadStatus', `✅ Datos cargados: ${allData.ingredients.length} ingredientes, ${allData.recipes.length} recetas`, 'success');
                renderRecipesList();
                updateConnectionStatus();
                
            } catch (error) {
                showMessage('loadStatus', `❌ Error: ${error.message}`, 'error');
            }
        }

        // ============================================================================
        // RENDERIZAR LISTA DE RECETAS DEL DOC
        // ============================================================================
        function renderRecipesList() {
            const container = document.getElementById('recipesList');
            if (allData.recipes.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999; padding: 40px;">No se encontraron recetas. Carga una manualmente o verifica tu Google Doc.</p>';
                return;
            }

            container.innerHTML = allData.recipes.map(recipe => `
                <div class="recipe-card" onclick="loadRecipeFromDoc('${recipe.name.replace(/'/g, "\\'")}')">
                    <h4>${recipe.name}</h4>
                    <p>🥣 Masa: ${recipe.masa.length} ingredientes</p>
                    <p>🍫 Relleno: ${recipe.relleno.length} ingredientes</p>
                    <p style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #ddd;">📋 Clickea para usar</p>
                </div>
            `).join('');
        }

        // ============================================================================
        // CARGAR RECETA DESDE DOC O TEXTO MANUAL
        // ============================================================================
        function loadRecipeFromDoc(recipeName) {
            const recipe = allData.recipes.find(r => r.name === recipeName);
            if (!recipe) return;

            document.getElementById('cookieName').value = recipe.name;
            
            recipeData.masa = recipe.masa.map(ing => parseIngredientLine(ing));
            recipeData.relleno = recipe.relleno.map(ing => parseIngredientLine(ing));
            recipeData.topping = recipe.topping.map(ing => parseIngredientLine(ing));

            showRecipeEditor();
        }

        function parseAndLoadRecipe() {
            const name = document.getElementById('cookieName').value.trim();
            const text = document.getElementById('recipeText').value.trim();

            if (!name && !text) {
                showMessage('loadStatus', '❌ Completa el nombre o pega una receta', 'error');
                return;
            }

            if (!name) {
                showMessage('loadStatus', '❌ Completa el nombre de la cookie', 'error');
                return;
            }

            // Parse manual
            const lines = text.split('\n');
            recipeData = { masa: [], relleno: [], topping: [] };
            let currentSection = null;

            lines.forEach(line => {
                const upper = line.toUpperCase().trim();
                if (upper.includes('MASA')) currentSection = 'masa';
                else if (upper.includes('RELLENO')) currentSection = 'relleno';
                else if (upper.includes('TOPPING')) currentSection = 'topping';
                else if (line.trim() && currentSection) {
                    const ing = parseIngredientLine(line);
                    if (ing.name) recipeData[currentSection].push(ing);
                }
            });

            if (Object.values(recipeData).every(arr => arr.length === 0) && text) {
                showMessage('loadStatus', '⚠️ No se encontraron ingredientes. Verifica el formato.', 'warning');
            }

            showRecipeEditor();
        }

        function parseIngredientLine(line) {
            // Parse: "460g manteca pomada" o "460 g manteca" o "Nutella 615g"
            const match = line.match(/(\d+(?:\.\d+)?)\s*(g|kg|ml|l|u)/i);
            if (!match) return { name: '', quantity: '', unit: 'g', price: 0, ingredient: null };

            const quantity = parseFloat(match[1]);
            const unit = match[2].toLowerCase();
            const name = line.replace(match[0], '').trim();

            // Buscar en ingredientes cargados
            const foundIng = allData.ingredients.find(ing => 
                ing.nombre.toLowerCase().includes(name.toLowerCase()) ||
                name.toLowerCase().includes(ing.nombre.toLowerCase())
            );

            return {
                name: name,
                quantity: quantity,
                unit: unit,
                price: foundIng ? foundIng.precio : 0,
                ingredient: foundIng || null
            };
        }

        // ============================================================================
        // MOSTRAR EDITOR DE RECETA
        // ============================================================================
        function showRecipeEditor() {
            document.getElementById('recipesList').parentElement.style.display = 'none';
            document.getElementById('recipeEditor').style.display = 'block';
            document.getElementById('editRecipeName').textContent = document.getElementById('cookieName').value;

            renderIngredientRows('masa');
            renderIngredientRows('relleno');
            renderIngredientRows('topping');
            recalculateCosts();
        }

        function renderIngredientRows(section) {
            const container = document.getElementById(section + 'Container');
            container.innerHTML = recipeData[section].map((ing, idx) => `
                <div class="ing-row">
                    <input type="text" value="${ing.name}" onchange="recipeData.${section}[${idx}].name = this.value; recalculateCosts()">
                    <input type="number" step="0.1" value="${ing.quantity}" onchange="recipeData.${section}[${idx}].quantity = parseFloat(this.value); recalculateCosts()">
                    <select onchange="recipeData.${section}[${idx}].unit = this.value; recalculateCosts()">
                        <option value="g" ${ing.unit === 'g' ? 'selected' : ''}>g</option>
                        <option value="kg" ${ing.unit === 'kg' ? 'selected' : ''}>kg</option>
                        <option value="ml" ${ing.unit === 'ml' ? 'selected' : ''}>ml</option>
                        <option value="l" ${ing.unit === 'l' ? 'selected' : ''}>l</option>
                        <option value="u" ${ing.unit === 'u' ? 'selected' : ''}>u</option>
                    </select>
                    <input type="number" step="0.01" value="${ing.price}" onchange="recipeData.${section}[${idx}].price = parseFloat(this.value); recalculateCosts()">
                    <button class="btn-small" onclick="recipeData.${section}.splice(${idx}, 1); renderIngredientRows('${section}'); recalculateCosts();">❌</button>
                </div>
            `).join('');
        }

        // ============================================================================
        // CALCULAR COSTOS
        // ============================================================================
        function recalculateCosts() {
            const qty = parseInt(document.getElementById('cookieQty').value) || 22;
            const weight = parseInt(document.getElementById('cookieWeight').value) || 130;
            const packagingCost = parseFloat(document.getElementById('packagingCost').value) || 0;

            let totalIngredients = 0;

            ['masa', 'relleno', 'topping'].forEach(section => {
                recipeData[section].forEach(ing => {
                    if (ing.quantity && ing.price) {
                        let cost = ing.quantity * ing.price;
                        if (ing.unit === 'kg') cost = ing.quantity * ing.price;
                        else if (ing.unit === 'g') cost = (ing.quantity / 1000) * ing.price;
                        else if (ing.unit === 'l') cost = ing.quantity * ing.price;
                        else if (ing.unit === 'ml') cost = (ing.quantity / 1000) * ing.price;
                        totalIngredients += cost;
                    }
                });
            });

            const totalWithPackaging = totalIngredients + packagingCost;
            const indirectsPercent = (config.mermas + config.transports + config.marketing) / 100;
            const totalWithIndirects = totalWithPackaging * (1 + indirectsPercent);
            const costPerCookie = totalWithIndirects / qty;
            const pvpSuggested = costPerCookie * 2;
            const margin = pvpSuggested - costPerCookie;

            const html = `
                <div class="cost-summary">
                    <div class="cost-row">
                        <span>Costo ingredientes (${qty} cookies):</span>
                        <strong>$${totalIngredients.toLocaleString('es-AR')}</strong>
                    </div>
                    <div class="cost-row">
                        <span>+ Packaging:</span>
                        <strong>$${packagingCost.toLocaleString('es-AR')}</strong>
                    </div>
                    <div class="cost-row">
                        <span>Subtotal:</span>
                        <strong>$${totalWithPackaging.toLocaleString('es-AR')}</strong>
                    </div>
                    <div class="cost-row">
                        <span>+ Costos indirectos (${config.mermas + config.transports + config.marketing}%):</span>
                        <strong>$${(totalWithPackaging * indirectsPercent).toLocaleString('es-AR')}</strong>
                    </div>
                    <div class="cost-row total">
                        <span>COSTO TOTAL POR COOKIE:</span>
                        <strong>$${costPerCookie.toLocaleString('es-AR', {maximumFractionDigits: 0})}</strong>
                    </div>
                    <div class="cost-row highlight">
                        <span>💰 PVP SUGERIDO (100% margen):</span>
                        <strong>$${pvpSuggested.toLocaleString('es-AR', {maximumFractionDigits: 0})}</strong>
                    </div>
                    <div class="cost-row">
                        <span>Ganancia por cookie:</span>
                        <strong>$${margin.toLocaleString('es-AR', {maximumFractionDigits: 0})}</strong>
                    </div>
                </div>
            `;

            document.getElementById('costSummary').innerHTML = html;
        }

        // ============================================================================
        // CONFIGURACIÓN
        // ============================================================================
        function updateIndirectsDisplay() {
            const total = (parseInt(document.getElementById('mermas').value) || 0) +
                         (parseInt(document.getElementById('transports').value) || 0) +
                         (parseInt(document.getElementById('marketing').value) || 0);
            document.getElementById('totalIndirect').textContent = total + '%';
        }

        function saveConfig() {
            config.mermas = parseInt(document.getElementById('mermas').value) || 0;
            config.transports = parseInt(document.getElementById('transports').value) || 0;
            config.marketing = parseInt(document.getElementById('marketing').value) || 0;
            localStorage.setItem('bluConfig', JSON.stringify(config));
            showMessage('loadStatus', '✅ Configuración guardada', 'success');
        }

        function updateConnectionStatus() {
            const html = `
                <div class="message success">
                    ✅ <strong>Conectada a Google Sheets:</strong> ${allData.ingredients.length} ingredientes cargados<br>
                    ✅ <strong>Conectada a Google Docs:</strong> ${allData.recipes.length} recetas cargadas<br>
                    ✅ <strong>Packaging disponible:</strong> ${allData.packaging.length} opciones
                </div>
            `;
            document.getElementById('connectionStatus').innerHTML = html;
        }

        // ============================================================================
        // UTILIDADES
        // ============================================================================
        function backToList() {
            document.getElementById('recipeEditor').style.display = 'none';
            document.getElementById('recipesList').parentElement.style.display = 'block';
            clearForm();
        }

        function clearForm() {
            document.getElementById('cookieName').value = '';
            document.getElementById('recipeText').value = '';
            document.getElementById('loadStatus').innerHTML = '';
            recipeData = { masa: [], relleno: [], topping: [] };
        }

        // ============================================================================
        // INIT
        // ============================================================================
        window.addEventListener('DOMContentLoaded', () => {
            updateIndirectsDisplay();
            loadData();
        });
    </script>
</body>
</html>
