<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blu Bakery - Calculador de Costos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui; background: #f5f7fa; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; }
        header h1 { color: #004e64; font-size: 2em; }
        .tabs { display: flex; gap: 10px; margin-bottom: 30px; }
        .tab-btn { padding: 12px 24px; border: none; background: #ddd; cursor: pointer; border-radius: 6px; font-weight: 600; }
        .tab-btn.active { background: #004e64; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-top: 20px; margin-bottom: 8px; color: #333; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-family: inherit; font-size: 1em; margin-bottom: 12px; }
        input:focus, textarea:focus { outline: none; border-color: #004e64; box-shadow: 0 0 0 3px rgba(0,78,100,0.1); }
        button { padding: 12px 24px; background: #004e64; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; margin-right: 10px; margin-top: 10px; }
        button:hover { background: #003845; }
        .ingredient-row { display: grid; grid-template-columns: 1fr 100px 80px auto; gap: 10px; align-items: center; padding: 12px; background: #f9f9f9; border-radius: 6px; margin-bottom: 10px; }
        .ingredient-row input { margin: 0; }
        .ingredient-row button { margin: 0; padding: 8px 12px; font-size: 0.9em; }
        .section { margin: 30px 0; padding: 20px; background: #f9f9f9; border-left: 4px solid #d7a13a; border-radius: 6px; }
        .section h3 { color: #004e64; margin-bottom: 15px; }
        .cost-result { background: #f2e6d8; padding: 20px; border-radius: 6px; margin-top: 20px; }
        .cost-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #ddd; }
        .cost-row.total { font-weight: 700; font-size: 1.2em; border-bottom: none; padding-top: 15px; }
        .message { padding: 15px; border-radius: 6px; margin-bottom: 20px; }
        .message.success { background: #d4edda; color: #155724; }
        .message.error { background: #f8d7da; color: #721c24; }
        .message.info { background: #d1ecf1; color: #0c5460; }
        .recipe-card { background: white; border: 2px solid #004e64; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .recipe-card h4 { color: #004e64; margin-bottom: 10px; }
        .recipe-card p { color: #666; font-size: 0.9em; margin-bottom: 10px; }
        .recipe-card button { margin: 0; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍪 Blu Bakery - Calculador de Costos</h1>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('calculator')">📝 Calculador</button>
            <button class="tab-btn" onclick="switchTab('config')">⚙️ Configuración</button>
        </div>

        <!-- TAB CALCULADOR -->
        <div id="calculator" class="tab-content active">
            <div class="card">
                <h2>📝 Nueva Cookie</h2>
                
                <label>Nombre de la cookie:</label>
                <input type="text" id="cookieName" placeholder="Ej: COOKIE NUTELLA & ESPRESSO">

                <label>Cantidad de cookies por tanda:</label>
                <input type="number" id="cookieQty" value="22" min="1">

                <label>Peso por cookie (g):</label>
                <input type="number" id="cookieWeight" value="130" min="1">

                <!-- MASA -->
                <div class="section">
                    <h3>🥣 MASA</h3>
                    <div id="masaContainer"></div>
                    <button onclick="addIngredient('masa')">+ Agregar ingrediente</button>
                </div>

                <!-- RELLENO -->
                <div class="section">
                    <h3>🍫 RELLENO</h3>
                    <div id="rellenoContainer"></div>
                    <button onclick="addIngredient('relleno')">+ Agregar ingrediente</button>
                </div>

                <!-- TOPPING -->
                <div class="section">
                    <h3>✨ TOPPING</h3>
                    <div id="toppingContainer"></div>
                    <button onclick="addIngredient('topping')">+ Agregar ingrediente</button>
                </div>

                <button onclick="calculateCost()" style="background: #d7a13a; color: #004e64; font-weight: 700; margin-top: 30px;">💰 CALCULAR COSTO</button>

                <div id="costResult"></div>
            </div>
        </div>

        <!-- TAB CONFIGURACIÓN -->
        <div id="config" class="tab-content">
            <div class="card">
                <h2>⚙️ Configuración - Costos Indirectos</h2>

                <label>Mermas (%):</label>
                <input type="number" id="mermas" value="8" min="0" max="100">

                <label>Traslados (%):</label>
                <input type="number" id="transports" value="5" min="0" max="100">

                <label>Marketing (%):</label>
                <input type="number" id="marketing" value="4" min="0" max="100">

                <div style="background: #f2e6d8; padding: 15px; border-radius: 6px; margin-top: 20px;">
                    <strong>Total Indirectos: <span id="totalIndirect">17%</span></strong>
                </div>

                <button onclick="saveConfig()">💾 Guardar</button>
            </div>
        </div>
    </div>

    <script>
        // DATOS GLOBALES
        let ingredients = {
            masa: [],
            relleno: [],
            topping: []
        };

        let config = JSON.parse(localStorage.getItem('bluConfig')) || {
            mermas: 8,
            transports: 5,
            marketing: 4
        };

        let allIngredientsData = [];

        // === FUNCIONES BÁSICAS ===
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function updateIndirectsDisplay() {
            const total = config.mermas + config.transports + config.marketing;
            document.getElementById('totalIndirect').textContent = total + '%';
            document.getElementById('mermas').value = config.mermas;
            document.getElementById('transports').value = config.transports;
            document.getElementById('marketing').value = config.marketing;
        }

        function saveConfig() {
            config.mermas = parseInt(document.getElementById('mermas').value) || 0;
            config.transports = parseInt(document.getElementById('transports').value) || 0;
            config.marketing = parseInt(document.getElementById('marketing').value) || 0;
            localStorage.setItem('bluConfig', JSON.stringify(config));
            updateIndirectsDisplay();
            alert('✅ Configuración guardada');
        }

        // === INGREDIENTES ===
        function addIngredient(section) {
            const newIng = {
                id: Date.now(),
                name: '',
                quantity: '',
                unit: 'g',
                price: 0
            };
            ingredients[section].push(newIng);
            renderIngredients(section);
        }

        function removeIngredient(section, id) {
            ingredients[section] = ingredients[section].filter(ing => ing.id !== id);
            renderIngredients(section);
        }

        function renderIngredients(section) {
            const container = document.getElementById(section + 'Container');
            container.innerHTML = ingredients[section].map(ing => `
                <div class="ingredient-row">
                    <input type="text" placeholder="Ingrediente" value="${ing.name}" onchange="updateIngredient('${section}', ${ing.id}, 'name', this.value)">
                    <input type="number" placeholder="Cant." value="${ing.quantity}" onchange="updateIngredient('${section}', ${ing.id}, 'quantity', this.value)">
                    <select onchange="updateIngredient('${section}', ${ing.id}, 'unit', this.value)">
                        <option value="g" ${ing.unit === 'g' ? 'selected' : ''}>g</option>
                        <option value="kg" ${ing.unit === 'kg' ? 'selected' : ''}>kg</option>
                        <option value="ml" ${ing.unit === 'ml' ? 'selected' : ''}>ml</option>
                        <option value="l" ${ing.unit === 'l' ? 'selected' : ''}>l</option>
                        <option value="u" ${ing.unit === 'u' ? 'selected' : ''}>u</option>
                    </select>
                    <button onclick="removeIngredient('${section}', ${ing.id})">❌</button>
                </div>
            `).join('');
        }

        function updateIngredient(section, id, field, value) {
            const ing = ingredients[section].find(i => i.id === id);
            if (ing) ing[field] = value;
        }

        // === CALCULAR COSTO ===
        function calculateCost() {
            const name = document.getElementById('cookieName').value;
            const qty = parseInt(document.getElementById('cookieQty').value);
            const weight = parseInt(document.getElementById('cookieWeight').value);

            if (!name || !qty || !weight) {
                alert('❌ Completa todos los datos');
                return;
            }

            let totalCost = 0;

            // Procesar ingredientes
            ['masa', 'relleno', 'topping'].forEach(section => {
                ingredients[section].forEach(ing => {
                    if (ing.name && ing.quantity && ing.price) {
                        let cost = parseFloat(ing.quantity) * parseFloat(ing.price);
                        if (ing.unit === 'kg') cost = cost; // ya está en precio/kg
                        else if (ing.unit === 'g') cost = cost / 1000;
                        else if (ing.unit === 'l') cost = cost;
                        else if (ing.unit === 'ml') cost = cost / 1000;
                        totalCost += cost;
                    }
                });
            });

            if (totalCost === 0) {
                alert('❌ Agrega ingredientes con precios');
                return;
            }

            // Calcular indirectos
            const indirectsPercent = (config.mermas + config.transports + config.marketing) / 100;
            const totalWithIndirects = totalCost * (1 + indirectsPercent);
            const costPerCookie = totalWithIndirects / qty;
            const pvpSuggested = costPerCookie * 2;

            // Mostrar resultado
            const html = `
                <div class="cost-result">
                    <h3>💰 RESULTADO</h3>
                    <div class="cost-row">
                        <span>Costo ingredientes (${qty} cookies):</span>
                        <strong>$${totalCost.toLocaleString('es-AR')}</strong>
                    </div>
                    <div class="cost-row">
                        <span>+ Costos indirectos (${config.mermas + config.transports + config.marketing}%):</span>
                        <strong>$${(totalCost * indirectsPercent).toLocaleString('es-AR')}</strong>
                    </div>
                    <div class="cost-row total">
                        <span>COSTO POR COOKIE:</span>
                        <strong>$${costPerCookie.toLocaleString('es-AR', {maximumFractionDigits: 0})}</strong>
                    </div>
                    <div class="cost-row">
                        <span>PVP Sugerido (100% margen):</span>
                        <strong>$${pvpSuggested.toLocaleString('es-AR', {maximumFractionDigits: 0})}</strong>
                    </div>
                </div>
            `;

            document.getElementById('costResult').innerHTML = html;
        }

        // === INIT ===
        window.addEventListener('DOMContentLoaded', () => {
            updateIndirectsDisplay();
            renderIngredients('masa');
            renderIngredients('relleno');
            renderIngredients('topping');
        });
    </script>
</body>
</html>
