<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blu Bakery - Calculador de Costos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            color: #004e64;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            color: #666;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #004e64;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 24px;
            border: none;
            background: transparent;
            color: #666;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: #004e64;
            border-bottom-color: #d7a13a;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #004e64;
            box-shadow: 0 0 0 3px rgba(0,78,100,0.1);
        }

        textarea {
            resize: vertical;
            min-height: 150px;
            font-family: monospace;
            font-size: 0.9em;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #004e64;
            color: white;
        }

        .btn-primary:hover {
            background: #003845;
        }

        .btn-secondary {
            background: #f2e6d8;
            color: #004e64;
            border: 1.5px solid #004e64;
        }

        .btn-secondary:hover {
            background: #e8d5c4;
        }

        .btn-danger {
            background: #d84949;
            color: white;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .section-title {
            font-size: 1.3em;
            font-weight: 700;
            color: #004e64;
            margin: 30px 0 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #d7a13a;
        }

        .cost-summary {
            background: linear-gradient(135deg, #f2e6d8 0%, #e8d5c4 100%);
            border-left: 5px solid #d7a13a;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .cost-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }

        .cost-row.total {
            font-weight: 700;
            font-size: 1.2em;
            color: #004e64;
            padding-top: 15px;
        }

        .recipe-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .recipe-card {
            background: white;
            border: 2px solid #004e64;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
        }

        .recipe-card:hover {
            box-shadow: 0 8px 16px rgba(0,78,100,0.2);
        }

        .recipe-card h3 {
            color: #004e64;
            margin-bottom: 12px;
        }

        .recipe-card p {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 8px;
        }

        .message {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #f5c6cb;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid #bee5eb;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #004e64;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .ingredient-item {
            padding: 10px;
            background: #f9f9f9;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ingredient-item strong {
            color: #004e64;
        }

        .ingredient-item span {
            color: #666;
            font-size: 0.9em;
        }

        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .recipe-list {
                grid-template-columns: 1fr;
            }

            .tabs {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍪 Blu Bakery</h1>
            <p>Calculador Inteligente de Costos</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('recipes')">📝 Recetas</button>
            <button class="tab-btn" onclick="switchTab('productos')">🎁 Productos</button>
            <button class="tab-btn" onclick="switchTab('config')">⚙️ Configuración</button>
        </div>

        <!-- TAB RECETAS -->
        <div id="recipes" class="tab-content active">
            <div class="card">
                <h2>📝 Crear Nueva Cookie</h2>
                <div id="dataStatus" class="message info" style="display: none;">
                    ⏳ Cargando datos desde tu Sheet y Doc...
                </div>

                <div class="form-group">
                    <label>Nombre de la cookie</label>
                    <input type="text" id="recipeName" placeholder="Ej: COOKIE NUTELLA & ESPRESSO">
                </div>

                <div class="form-group">
                    <label>Cantidad de cookies por tanda</label>
                    <input type="number" id="cookiesPerBatch" value="22" min="1">
                </div>

                <div class="form-group">
                    <label>Peso por cookie (g)</label>
                    <input type="number" id="cookieWeight" value="130" min="1">
                </div>

                <div class="section-title">🥣 MASA</div>
                <div id="masaIngredients"></div>

                <div class="section-title">🍫 RELLENO</div>
                <div id="rellenoIngredients"></div>

                <div class="section-title">✨ TOPPING</div>
                <div id="toppingIngredients"></div>

                <div class="button-group">
                    <button class="btn-primary" onclick="calculateRecipeCost()">💰 Calcular Costo</button>
                </div>

                <div id="costResult"></div>
            </div>

            <div id="savedRecipes" class="recipe-list"></div>
        </div>

        <!-- TAB PRODUCTOS -->
        <div id="productos" class="tab-content">
            <div class="card">
                <h2>🎁 Mis Productos</h2>
                <div id="productsList"></div>
            </div>
        </div>

        <!-- TAB CONFIGURACIÓN -->
        <div id="config" class="tab-content">
            <div class="card">
                <h2>⚙️ Configuración</h2>
                
                <div class="section-title">Costos Indirectos</div>
                
                <div class="form-group">
                    <label>Mermas (%):</label>
                    <input type="number" id="mermas" value="8" min="0" max="100">
                </div>

                <div class="form-group">
                    <label>Traslados (%):</label>
                    <input type="number" id="transports" value="5" min="0" max="100">
                </div>

                <div class="form-group">
                    <label>Marketing (%):</label>
                    <input type="number" id="marketing" value="4" min="0" max="100">
                </div>

                <div class="cost-summary">
                    <strong>Total Indirectos:</strong> <span id="totalIndirect">17%</span>
                </div>

                <button class="btn-primary" onclick="saveConfig()">💾 Guardar</button>

                <div class="section-title">📊 Estado de Conexión</div>
                <div id="connectionStatus"></div>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx0-DaHbBBVPeMJK3RhG0sLWj-LWLj9scR3YmABlLEscEFpOCY3UlcHAr31lawrXEyAlg/exec";
        
        let allData = {
            ingredients: [],
            recipes: [],
            packaging: []
        };

        let savedRecipes = JSON.parse(localStorage.getItem('bluRecipes')) || [];
        let config = JSON.parse(localStorage.getItem('bluConfig')) || {
            mermas: 8,
            transports: 5,
            marketing: 4
        };

        // === FUNCIONES PRINCIPALES ===
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function showMessage(elementId, text, type = 'info') {
            const div = document.getElementById(elementId);
            div.innerHTML = `<div class="message ${type}">${text}</div>`;
        }

        // === CARGAR DATOS DEL APPS SCRIPT ===
        async function loadDataFromAppsScript() {
            try {
                showMessage('dataStatus', '⏳ Cargando datos...', 'info');
                
                const response = await fetch(APPS_SCRIPT_URL);
                const data = await response.json();

                allData = {
                    ingredients: data.ingredients || [],
                    recipes: data.recipes || [],
                    packaging: data.packaging || []
                };

                showMessage('dataStatus', '✅ Datos cargados correctamente', 'success');
                updateConnectionStatus();
                renderRecipesFromDoc();
                
            } catch (error) {
                showMessage('dataStatus', `❌ Error al cargar: ${error.message}`, 'error');
                console.error(error);
            }
        }

        // === MOSTRAR RECETAS DEL DOC ===
        function renderRecipesFromDoc() {
            const container = document.getElementById('savedRecipes');
            
            if (allData.recipes.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999;">No se encontraron recetas en tu documento.</p>';
                return;
            }

            container.innerHTML = allData.recipes.map(recipe => `
                <div class="recipe-card">
                    <h3>${recipe.name}</h3>
                    <p><strong>Masa:</strong> ${recipe.masa.length} ingredientes</p>
                    <p><strong>Relleno:</strong> ${recipe.relleno.length} ingredientes</p>
                    <button class="btn-secondary btn-small" onclick="loadRecipe('${recipe.name.replace(/'/g, "\\'")}', '${JSON.stringify(recipe.masa).replace(/'/g, "\\'")}', '${JSON.stringify(recipe.relleno).replace(/'/g, "\\'")}')">Usar esta receta</button>
                </div>
            `).join('');
        }

        function loadRecipe(name, masaJson, rellenoJson) {
            document.getElementById('recipeName').value = name;
            const masa = JSON.parse(masaJson);
            const relleno = JSON.parse(rellenoJson);
            
            renderIngredientInputs('masaIngredients', masa);
            renderIngredientInputs('rellenoIngredients', relleno);
        }

        function renderIngredientInputs(containerId, ingredients) {
            const container = document.getElementById(containerId);
            container.innerHTML = ingredients.map((ing, idx) => `
                <div class="ingredient-item">
                    <span>${ing}</span>
                </div>
            `).join('');
        }

        // === CALCULAR COSTO ===
        function calculateRecipeCost() {
            const name = document.getElementById('recipeName').value;
            const cookiesPerBatch = parseInt(document.getElementById('cookiesPerBatch').value);
            const cookieWeight = parseInt(document.getElementById('cookieWeight').value);

            if (!name) {
                showMessage('costResult', 'Completa el nombre de la cookie', 'error');
                return;
            }

            let totalCost = 0;
            let details = [];

            // Parse ingredients from UI
            const masaItems = document.querySelectorAll('#masaIngredients .ingredient-item');
            const rellenoItems = document.querySelectorAll('#rellenoIngredients .ingredient-item');

            masaItems.forEach(item => {
                const text = item.innerText;
                const cost = parseIngredientCost(text);
                totalCost += cost;
                details.push({ item: text, cost });
            });

            rellenoItems.forEach(item => {
                const text = item.innerText;
                const cost = parseIngredientCost(text);
                totalCost += cost;
                details.push({ item: text, cost });
            });

            // Calcular con indirectos
            const indirectsPercent = (config.mermas + config.transports + config.marketing) / 100;
            const totalWithIndirects = totalCost * (1 + indirectsPercent);
            const costPerCookie = totalWithIndirects / cookiesPerBatch;

            // Mostrar resultado
            let html = `
                <div class="cost-summary">
                    <div class="cost-row">
                        <strong>Costo total (${cookiesPerBatch} cookies):</strong>
                        <strong>$${totalCost.toLocaleString('es-AR')}</strong>
                    </div>
                    <div class="cost-row">
                        <strong>+ Costos indirectos (${((config.mermas + config.transports + config.marketing))}%):</strong>
                        <strong>$${(totalCost * indirectsPercent).toLocaleString('es-AR')}</strong>
                    </div>
                    <div class="cost-row total">
                        <strong>COSTO FINAL POR COOKIE:</strong>
                        <strong>$${costPerCookie.toLocaleString('es-AR', {maximumFractionDigits: 0})}</strong>
                    </div>
                    <div class="cost-row">
                        <strong>PVP Sugerido (100% margen):</strong>
                        <strong>$${(costPerCookie * 2).toLocaleString('es-AR', {maximumFractionDigits: 0})}</strong>
                    </div>
                </div>
            `;

            document.getElementById('costResult').innerHTML = html;
        }

        function parseIngredientCost(ingredientText) {
            // Búsqueda simple: encontrar el precio en el texto
            const match = ingredientText.match(/\$[\d,.-]+/);
            if (match) {
                return parseFloat(match[0].replace(/[$,.-]/g, ''));
            }
            return 0;
        }

        // === CONFIGURACIÓN ===
        function saveConfig() {
            config.mermas = parseInt(document.getElementById('mermas').value);
            config.transports = parseInt(document.getElementById('transports').value);
            config.marketing = parseInt(document.getElementById('marketing').value);

            localStorage.setItem('bluConfig', JSON.stringify(config));
            updateConfigDisplay();
            showMessage('costResult', '✅ Configuración guardada', 'success');
        }

        function updateConfigDisplay() {
            document.getElementById('mermas').value = config.mermas;
            document.getElementById('transports').value = config.transports;
            document.getElementById('marketing').value = config.marketing;
            document.getElementById('totalIndirect').textContent = (config.mermas + config.transports + config.marketing) + '%';
        }

        function updateConnectionStatus() {
            const html = `
                <div class="message success">
                    ✅ Conectada a Google Sheets<br>
                    📊 Ingredientes cargados: ${allData.ingredients.length}<br>
                    📝 Recetas encontradas: ${allData.recipes.length}
                </div>
            `;
            document.getElementById('connectionStatus').innerHTML = html;
        }

        // === INIT ===
        window.addEventListener('DOMContentLoaded', () => {
            updateConfigDisplay();
            loadDataFromAppsScript();
        });
    </script>
</body>
</html>
